<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>sosois · 준비 중</title>
  <style>
    :root { --bg: #f6f8fa; --card: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --accent: #0969da; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --card: #161b22; --fg: #e6edf3; --muted: #9198a1; --line: #30363d; --accent: #4493f8; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
           font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
           display: flex; align-items: center; justify-content: center; }
    main { width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--line);
           border-radius: 12px; padding: 40px 32px; text-align: center; }
    .badge { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .04em;
             color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 4px 10px; }
    h1 { margin: 16px 0 8px; font-size: 28px; }
    p { margin: 0; color: var(--muted); line-height: 1.6; }
    footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <span class="badge">준비 중</span>
    <h1>sosois</h1>
    <p>현재 사이트를 준비하고 있습니다.<br>곧 새로운 내용으로 찾아뵙겠습니다.</p>
    <footer>&copy; <span id="y">2026</span> sosois</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
